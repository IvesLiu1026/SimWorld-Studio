services:
  postgres:
    profiles: ["asset-stack"]
    image: "${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an approved pinned tag or digest}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-asset_db}"
      POSTGRES_USER: "${POSTGRES_USER:-simworld}"
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_password"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${POSTGRES_PASSWORD_FILE_HOST:?Set POSTGRES_PASSWORD_FILE_HOST to a mode-0600 secret}:/run/secrets/postgres_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    profiles: ["asset-stack"]
    image: "${QDRANT_IMAGE:?Set QDRANT_IMAGE to an approved pinned tag or digest}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3; IFS= read -r status <&3; [[ $$status == *\" 200 \"* ]]'"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  embedding:
    profiles: ["asset-stack"]
    image: "${EMBED_SERVICE_IMAGE:?Set EMBED_SERVICE_IMAGE to the reviewed immutable image digest}"
    restart: unless-stopped
    environment:
      PORT: "7777"
      EMBED_DENSE_MODEL: "${EMBED_DENSE_MODEL:?Set EMBED_DENSE_MODEL}"
      EMBED_DENSE_REVISION: "${EMBED_DENSE_REVISION:?Set EMBED_DENSE_REVISION to the deployed model artifact revision}"
      EMBED_DENSE_MODEL_PATH: "/opt/models/dense"
      EMBED_SPARSE_MODEL: "${EMBED_SPARSE_MODEL:?Set EMBED_SPARSE_MODEL}"
      EMBED_SPARSE_REVISION: "${EMBED_SPARSE_REVISION:?Set EMBED_SPARSE_REVISION to the deployed model artifact revision}"
      EMBED_SPARSE_MODEL_PATH: "/opt/models/sparse"
      EMBED_DENSE_SIZE: "${EMBED_DENSE_SIZE:?Set EMBED_DENSE_SIZE}"
      EMBED_VERSION: "${EMBED_VERSION:?Set EMBED_VERSION to the index recipe revision}"
      EMBED_PRELOAD: "1"
      EMBED_SERVICE_TOKEN_FILE: "/run/secrets/embed_service_token"
      FASTEMBED_CACHE_PATH: "/var/cache/fastembed"
    ports:
      - "127.0.0.1:${EMBED_HOST_PORT:-7777}:7777"
    volumes:
      - embedding_model_cache:/var/cache/fastembed
      - ${EMBED_DENSE_MODEL_DIR_HOST:?Set the verified dense model artifact directory}:/opt/models/dense:ro
      - ${EMBED_SPARSE_MODEL_DIR_HOST:?Set the verified sparse model artifact directory}:/opt/models/sparse:ro
      - ${EMBED_SERVICE_TOKEN_FILE_HOST:?Set the mode-0600 embedding bearer token file}:/run/secrets/embed_service_token:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:7777/health', timeout=3)); raise SystemExit(0 if r.get('status') == 'ready' else 1)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres_data:
  qdrant_data:
  embedding_model_cache:
