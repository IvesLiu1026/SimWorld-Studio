<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>SimWorld Studio</title>
  <script>
  (function(){
    var _demoRunning = false;
    var _demoExpanded = false;
    var _demoPresetId = "default_5_rounds";
    var _demoCurrentRunId = null;

    function _el(id) { return document.getElementById(id); }
    function _sleep(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }

    function _log(text) {
      var box = _el("_demo_log");
      if (!box) return;
      var row = document.createElement("div");
      row.style.cssText = "padding:4px 0;border-bottom:1px solid #21262d;color:#c9d1d9;font-size:11px;line-height:1.4;";
      row.textContent = text;
      box.prepend(row);
      while (box.childNodes.length > 80) box.removeChild(box.lastChild);
    }

    function _setRunningState(running, label) {
      var btn = _el("_demo_btn");
      var sel = _el("_demo_mode");
      if (!btn || !sel) return;
      _demoRunning = !!running;
      btn.disabled = !!running;
      sel.disabled = !!running;
      btn.textContent = label || (running ? "⏳ Running..." : "▶ Demo");
      btn.style.background = running ? "#6e7681" : "#238636";
    }

    function _setExpanded(expanded) {
      _demoExpanded = !!expanded;
      var body = _el("_demo_body");
      var toggle = _el("_demo_toggle");
      if (body) body.style.display = _demoExpanded ? "block" : "none";
      if (toggle) toggle.textContent = _demoExpanded ? "▾" : "▸";
    }

    function _formatLaneSummary(lane) {
      if (!lane || !lane.summary) return "";
      var s = lane.summary;
      var laneName = lane.id || lane.lane || "lane";
      return laneName + ": rounds=" + s.roundsCompleted + "/" + s.roundsTotal + ", errors=" + s.roundsErrored +
        ", learned_tools=" + s.learnedToolsCount + ", learned_skills=" + s.learnedSkillsCount;
    }

    async function _fetchJson(url) {
      var res = await fetch(url, { method: "GET" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    }

    async function _loadPresets() {
      try {
        var presets = await _fetchJson("/api/demo/presets");
        if (Array.isArray(presets) && presets.length > 0) {
          _demoPresetId = presets[0].id || _demoPresetId;
          _log("Loaded demo preset: " + (_demoPresetId || "default"));
        }
      } catch (err) {
        _log("Preset load failed; using default preset id.");
      }
    }

    async function _refreshHistory() {
      try {
        var runs = await _fetchJson("/api/demo/runs?limit=8");
        var host = _el("_demo_history");
        if (!host) return;
        host.innerHTML = "";
        for (var i = 0; i < runs.length; i++) {
          var run = runs[i];
          var item = document.createElement("div");
          item.style.cssText = "padding:6px 0;border-bottom:1px solid #21262d;";
          var created = run.createdAt ? new Date(run.createdAt).toLocaleTimeString() : "--";
          var laneText = Array.isArray(run.lanes) ? run.lanes.map(_formatLaneSummary).filter(Boolean).join(" | ") : "";
          item.innerHTML =
            "<div style='color:#e6edf3;font-size:11px;'>" +
            (run.id || "run") + " · " + (run.mode || "evolution") + " · " + (run.status || "unknown") +
            "</div>" +
            "<div style='color:#8b949e;font-size:10px;margin-top:2px;'>" + created + "</div>" +
            (laneText ? "<div style='color:#8b949e;font-size:10px;margin-top:3px;'>" + laneText + "</div>" : "");
          host.appendChild(item);
        }
      } catch (err) {
        _log("History refresh failed.");
      }
    }

    async function _streamDemoRun(payload) {
      var res = await fetch("/api/demo/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload || {}),
      });
      if (!res.ok || !res.body) throw new Error("Run start failed: HTTP " + res.status);

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      function handleEvent(eventType, data) {
        if (eventType === "run_started") {
          _demoCurrentRunId = data.runId || null;
          _log("Run started: " + (data.runId || "unknown") + " (" + (data.mode || "evolution") + ")");
          try { window.dispatchEvent(new CustomEvent("simworld_demo_run_started", { detail: data || {} })); } catch (_) {}
          return;
        }
        if (eventType === "lane_started") {
          _log("Lane started: " + data.lane);
          return;
        }
        if (eventType === "round_started") {
          _log(data.lane + " round " + data.round + " started");
          try {
            window.dispatchEvent(
              new CustomEvent("simworld_demo_round_started", {
                detail: {
                  key: String((data.lane || "") + ":" + String(data.round || "")),
                  lane: data.lane,
                  round: data.round,
                  prompt: data.prompt || "",
                },
              })
            );
          } catch (_) {}
          return;
        }
        if (eventType === "round_completed") {
          _log(data.lane + " round " + data.round + " completed" + (data.isError ? " (error)" : ""));
          try {
            window.dispatchEvent(
              new CustomEvent("simworld_demo_round_completed", {
                detail: {
                  key: String((data.lane || "") + ":" + String(data.round || "")),
                  lane: data.lane,
                  round: data.round,
                  assistantText: data.assistantText || "",
                },
              })
            );
          } catch (_) {}
          return;
        }
        if (eventType === "evolution_wait_start") {
          _log("waiting for evolution to finish");
          return;
        }
        if (eventType === "evolution_wait_progress") {
          _log("waiting for evolution: queue=" + data.queueLength + ", pending=" + data.pendingCount);
          return;
        }
        if (eventType === "evolution_wait_done") {
          _log("evolution wait done");
          return;
        }
        if (eventType === "lane_completed") {
          _log("Lane completed: " + _formatLaneSummary(data));
          return;
        }
        if (eventType === "run_completed") {
          _log("Run completed: " + (data.runId || _demoCurrentRunId || "unknown"));
          return;
        }
        if (eventType === "run_failed") {
          _log("Run failed: " + (data.message || "unknown error"));
          return;
        }
      }

      for (;;) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        var parts = buffer.split("\n\n");
        buffer = parts.pop() || "";
        for (var i = 0; i < parts.length; i++) {
          var lines = parts[i].split("\n");
          var type = "message";
          var dataText = "";
          for (var j = 0; j < lines.length; j++) {
            if (lines[j].indexOf("event: ") === 0) type = lines[j].slice(7).trim();
            if (lines[j].indexOf("data: ") === 0) dataText = lines[j].slice(6);
          }
          if (!dataText) continue;
          try {
            handleEvent(type, JSON.parse(dataText));
          } catch (_) {}
        }
      }
    }

    async function _startDemo() {
      if (_demoRunning) return;
      var modeSel = _el("_demo_mode");
      var mode = modeSel ? modeSel.value : "evolution";
      _setRunningState(true, "⏳ Running...");
      _log("Submitting demo run (" + mode + ")");
      try {
        await _streamDemoRun({
          presetId: _demoPresetId,
          mode: mode,
        });
      } catch (err) {
        _log("Run request failed: " + (err && err.message ? err.message : String(err)));
      } finally {
        _setRunningState(false, "▶ Demo");
        await _sleep(80);
        _refreshHistory();
      }
    }


    function _injectUi() {
      if (_el("_demo_widget")) return;
      var wrap = document.createElement("div");
      wrap.id = "_demo_widget";
      wrap.style.cssText = "position:fixed;bottom:48px;right:20px;z-index:9999;width:320px;background:#0d1117;border:1px solid #30363d;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;";
      wrap.innerHTML =
        "<div style='padding:8px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #21262d;'>" +
          "<button id='_demo_toggle' style='background:transparent;border:none;color:#8b949e;cursor:pointer;font-size:13px;padding:0 2px;'>▸</button>" +
          "<div style='flex:1;color:#e6edf3;font-size:12px;font-weight:600;'>Demo Runner</div>" +
          "<button id='_demo_btn' style='background:#238636;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;'>▶ Demo</button>" +
        "</div>" +
        "<div id='_demo_body' style='display:none;'>" +
        "<div style='padding:10px;display:flex;gap:8px;align-items:center;'>" +
          "<select id='_demo_mode' style='flex:1;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px;font-size:12px;padding:6px 8px;'>" +
            "<option value='baseline'>Baseline only</option>" +
            "<option value='evolution' selected>Evolution only</option>" +
          "</select>" +
        "</div>" +
        "<div style='padding:0 10px 10px 10px;'>" +
          "<div style='color:#8b949e;font-size:10px;margin-bottom:4px;'>Live progress</div>" +
          "<div id='_demo_log' style='max-height:120px;overflow:auto;background:#11161d;border:1px solid #21262d;border-radius:6px;padding:6px;'></div>" +
        "</div>" +
        "<div style='padding:0 10px 10px 10px;'>" +
          "<div style='color:#8b949e;font-size:10px;margin-bottom:4px;'>Recent runs</div>" +
          "<div id='_demo_history' style='max-height:140px;overflow:auto;background:#11161d;border:1px solid #21262d;border-radius:6px;padding:6px;'></div>" +
        "</div>" +
        "</div>";
      document.body.appendChild(wrap);

      var b = _el("_demo_btn");
      var toggle = _el("_demo_toggle");
      b.onmouseenter = function() { if (!b.disabled) b.style.background = "#2ea043"; };
      b.onmouseleave = function() { if (!b.disabled) b.style.background = "#238636"; };
      b.onclick = _startDemo;
      toggle.onclick = function() { _setExpanded(!_demoExpanded); };

      _setExpanded(false);
      _loadPresets();
      _refreshHistory();
    }

    if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", _injectUi); }
    else { setTimeout(_injectUi, 200); }
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
