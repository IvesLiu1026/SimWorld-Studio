<!DOCTYPE html>
<html style="width:100%;height:100%;margin:0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimWorld Viewport</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#0b1220;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff}
/* Cirrus player fills full space */
#playerUI,#videoElementParent{
  position:absolute!important;inset:0!important;
  width:100%!important;height:100%!important;
  background:#000!important;margin:0!important;padding:0!important;
}
#streamingVideo{
  width:100%!important;height:100%!important;
  object-fit:contain!important;display:block!important;
}
/* Hide all Cirrus UI chrome */
#uiFeatures,#controls,#settings-panel,#stats-panel,
#settingsBtn,#statsBtn,#xrBtn,#fullscreen-btn,
#connection,#qualityText,#ControlStats,
#latencyTestContainer,#dataChannelLatencyTestContainer,
#statisticsContainer{display:none!important}
/* Keep click-to-start overlays in DOM (needed for dispatchEvent), just hide visually */
#connectOverlay,#playOverlay{opacity:0!important;pointer-events:none!important}
#sw-status-overlay{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(11,18,32,0.92);z-index:999;gap:16px;
  transition:opacity 0.3s;
  pointer-events:none; /* clicks pass through to player.js activation layer */
}
#sw-status-overlay.hidden{opacity:0;}
#sw-retry-btn{ pointer-events:auto; }
#sw-spinner{
  width:44px;height:44px;border-radius:50%;
  border:3px solid rgba(37,99,235,0.25);border-top-color:#2563eb;
  animation:sw-spin 0.9s linear infinite;
}
@keyframes sw-spin{to{transform:rotate(360deg)}}
#sw-status-text{font-size:15px;font-weight:600;color:#e2e8f0;}
#sw-status-sub{font-size:12px;color:#64748b;text-align:center;max-width:280px;line-height:1.5;}
#sw-retry-btn{
  margin-top:4px;padding:7px 20px;border-radius:8px;
  background:#2563eb;color:#fff;border:none;
  font-size:13px;font-weight:600;cursor:pointer;display:none;
}
#sw-retry-btn:hover{background:#1d4ed8;}
#sw-pie-hint{
  display:none;margin-top:4px;padding:8px 14px;
  border-radius:8px;background:rgba(245,158,11,.12);
  border:1px solid rgba(245,158,11,.3);
  font-size:11px;color:#fcd34d;text-align:center;line-height:1.5;
}
#controls{
  position:absolute!important;top:6px!important;right:6px!important;left:auto!important;
  display:flex!important;flex-direction:row!important;gap:3px!important;
  background:rgba(0,0,0,0.5)!important;border-radius:6px!important;padding:3px!important;
  backdrop-filter:blur(8px)!important;-webkit-backdrop-filter:blur(8px)!important;
}
#controls>*{margin:0!important;width:1.4rem!important;height:1.4rem!important;padding:0.2rem!important;border-radius:4px!important;display:flex!important;align-items:center!important;justify-content:center!important;}
#controls #additionalinfo,#controls .tooltiptext{display:none!important}
#connection{position:absolute!important;bottom:6px!important;right:6px!important;left:auto!important;width:1.2rem!important;height:1.2rem!important;pointer-events:all!important;}
#qualityStatus{font-size:20px!important;padding:0!important}
#fullscreen-btn{display:none!important}
.panel-wrap{min-width:240px!important;max-width:300px!important;font-size:12px!important}
.panel{padding:0.6em!important}
</style>

<script>
// ── Step 1: Read cirrus port from URL, store globally ─────────────────────────
(function() {
  var _p = new URLSearchParams(location.search);
  var _cirrusPort = _p.get('cirrus') || '8685';
  var _proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  var _cirrusWsUrl = _proto + location.hostname + ':' + _cirrusPort;
  window._swCirrusPort = _cirrusPort;
  window._swCirrusWs   = _cirrusWsUrl;

  // Also update URL params for MatchViewportRes (best-effort, timing not critical)
  var _changed = false;
  if (!_p.has('MatchViewportRes')) { _p.set('MatchViewportRes', 'true'); _changed = true; }
  if (!_p.has('HoveringMouse'))    { _p.set('HoveringMouse', 'true');   _changed = true; }
  if (_p.get('ss') !== _cirrusWsUrl){ _p.set('ss', _cirrusWsUrl);       _changed = true; }
  if (_changed) history.replaceState({}, '', location.pathname + '?' + _p.toString());
})();

// ── Step 2: Monkey-patch WebSocket BEFORE player.js loads ─────────────────────
// player.js default signalling URL is ws://localhost:<page-port> (i.e. 3002).
// If it ignores ?ss= for any reason, this intercept guarantees it hits Cirrus.
(function() {
  var _OrigWS = window.WebSocket;
  var _pageOriginWs = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  window.WebSocket = function(url, protocols) {
    // Redirect same-origin WebSocket to Cirrus
    if (typeof url === 'string' && url.startsWith(_pageOriginWs)) {
      url = window._swCirrusWs;
    }
    return protocols ? new _OrigWS(url, protocols) : new _OrigWS(url);
  };
  window.WebSocket.CONNECTING = _OrigWS.CONNECTING;
  window.WebSocket.OPEN       = _OrigWS.OPEN;
  window.WebSocket.CLOSING    = _OrigWS.CLOSING;
  window.WebSocket.CLOSED     = _OrigWS.CLOSED;
  window.WebSocket.prototype  = _OrigWS.prototype;
})();
</script>

<!-- player.js loaded as static defer — guaranteed to run after inline scripts
     but BEFORE window.onload, so document.body.onload set by player.js fires correctly -->
<script defer src="/ue-assets/player.js"></script>
</head>

<body style="width:100%;height:100%">

<!-- Connection status overlay -->
<div id="sw-status-overlay">
  <div id="sw-spinner"></div>
  <div id="sw-status-text">Connecting to UE Stream…</div>
  <div id="sw-status-sub">Establishing WebRTC connection via Cirrus signalling server.</div>
  <div id="sw-pie-hint">
    Make sure Pixel Streaming is active in UE (Plugins → Pixel Streaming → Enable).
  </div>
  <button id="sw-retry-btn" onclick="swRetry()">Retry Connection</button>
</div>

<script>
// ── Silence benign player.js console noise ────────────────────────────────────
(function() {
  var origLog = console.log;
  console.log = function() {
    var msg = Array.prototype.join.call(arguments, ' ');
    if (msg.indexOf('Data channel cannot send yet') !== -1) return;
    if (msg.indexOf('Skipping sending message') !== -1) return;
    origLog.apply(console, arguments);
  };
})();

// ── Status helpers ────────────────────────────────────────────────────────────
var _overlay   = null, _retryBtn  = null;
var _statusTxt = null, _statusSub = null, _pieHint = null;

function swSetStatus(text, sub, showRetry, showPie) {
  if (!_overlay) return;
  _statusTxt.textContent = text;
  _statusSub.textContent = sub || '';
  _retryBtn.style.display  = showRetry ? 'block' : 'none';
  _pieHint.style.display   = showPie   ? 'block' : 'none';
  _overlay.classList.remove('hidden');
}
function swHideOverlay() {
  if (_overlay) _overlay.classList.add('hidden');
  try { window.parent.postMessage({ type: 'sw-stream-connected', cirrusPort: window._swCirrusPort }, '*'); } catch {}
}
function swRetry() {
  swSetStatus('Reconnecting…', 'Please wait.', false, false);
  location.reload();
}

// ── Watch for active video stream ─────────────────────────────────────────────
var _reconnectCount = 0;
var _connected = false;
var _lastVideoTime = null;
var _watchInterval = null;

function swStartWatch() {
  if (_watchInterval) clearInterval(_watchInterval);
  _watchInterval = setInterval(function() {
    var v = document.getElementById('streamingVideo');
    if (!v) return;
    if (v.readyState >= 2 && v.currentTime > 0) {
      if (_lastVideoTime === null || v.currentTime !== _lastVideoTime) {
        _lastVideoTime = v.currentTime;
        if (!_connected) {
          _connected = true;
          swHideOverlay();
        }
        return;
      }
    }
    // Video stalled or never started — show reconnect after a few checks
    if (_connected) {
      _connected = false;
      _reconnectCount++;
      swSetStatus(
        'Stream disconnected',
        'Attempting to reconnect…',
        _reconnectCount >= 3,
        _reconnectCount >= 3
      );
    }
  }, 1500);
}

// ── Listen for parent frame messages ─────────────────────────────────────────
window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'sw-focus-stream') {
    var v = document.getElementById('streamingVideo');
    if (v) v.focus();
    document.body.focus();
  }
  if (e.data.type === 'sw-reconnect') {
    _connected = false;
    _reconnectCount = 0;
    swRetry();
  }
});

document.addEventListener('mouseenter', function() { document.body.focus(); });

// ── Init on DOMContentLoaded ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  _overlay   = document.getElementById('sw-status-overlay');
  _retryBtn  = document.getElementById('sw-retry-btn');
  _statusTxt = document.getElementById('sw-status-text');
  _statusSub = document.getElementById('sw-status-sub');
  _pieHint   = document.getElementById('sw-pie-hint');
  swSetStatus('Connecting to UE Stream…', 'Cirrus :' + (window._swCirrusPort || '8685'), false, false);
});

// ── Start watching after player.js initialises (window load + 4s grace) ──────
window.addEventListener('load', function() {
  // Auto-click the Cirrus activation overlay — must target it directly since
  // player.js attaches the click handler to #playOverlay, not a parent element.
  setTimeout(function() {
    var target = document.getElementById('playOverlay') ||
                 document.getElementById('connectOverlay') ||
                 document.getElementById('playerUI') || document.body;
    target.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
  }, 1500);

  // ResizeObserver — notify player.js when container size changes (MatchViewportRes)
  setTimeout(function() {
    var container = document.getElementById('videoElementParent');
    if (!container || !window.ResizeObserver) return;
    var ro = new ResizeObserver(function() {
      window.dispatchEvent(new Event('resize'));
    });
    ro.observe(container);
  }, 2000);

  setTimeout(swStartWatch, 4000);
});
</script>
</body>
</html>
