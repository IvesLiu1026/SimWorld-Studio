<!DOCTYPE html>
<html style="width:100%;height:100%;margin:0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimWorld Viewport</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#0b1220;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff}

/* player.js root elements — fill full viewport */
#playerUI,#videoElementParent{
  position:absolute!important;inset:0!important;
  width:100%!important;height:100%!important;
  min-width:0!important;min-height:0!important;
  max-width:100vw!important;max-height:100vh!important;
  overflow:hidden!important;contain:size layout paint;
  background:#000!important;margin:0!important;padding:0!important;
}
#streamingVideo{
  position:absolute!important;inset:0!important;
  width:100%!important;height:100%!important;
  object-fit:contain!important;display:block!important;
  max-width:none!important;max-height:none!important;
}

/* Hide ALL Cirrus UI chrome */
#uiFeatures,#controls,#settings-panel,#stats-panel,
#settingsBtn,#statsBtn,#xrBtn,#fullscreen-btn,
#connection,#qualityText,#qualityStatus,#ControlStats,
#additionalinfo,.tooltiptext,
#latencyTestContainer,#dataChannelLatencyTestContainer,
#statisticsContainer{display:none!important}

/* Keep click-to-start overlays in DOM (dispatchEvent needs them) but invisible */
#connectOverlay,#playOverlay{opacity:0!important;pointer-events:none!important}

/* Pixel Streaming notifications/progress UI must not participate in layout.
   Some Cirrus builds append bottom-right toasts or loading bars near the video
   container; keeping them fixed prevents MatchViewportRes from recalculating
   the stream size when those transient nodes appear. */
#connectOverlay,#playOverlay,#afkOverlay,#disconnectOverlay,#messageOverlay,
#freezeFrameOverlay,#qualityStatus,#qualityText,
[class*="toast"],[class*="Toast"],[class*="notification"],[class*="Notification"],
[class*="message"],[class*="Message"],[class*="progress"],[class*="Progress"]{
  position:fixed!important;
  max-width:min(360px,calc(100vw - 24px))!important;
  max-height:calc(100vh - 24px)!important;
}

/* Status overlay */
#sw-status-overlay{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(11,18,32,0.92);z-index:999;gap:16px;
  transition:opacity 0.3s;
  pointer-events:none;
}
#sw-status-overlay.hidden{opacity:0;}
#sw-spinner{
  width:44px;height:44px;border-radius:50%;
  border:3px solid rgba(37,99,235,0.25);border-top-color:#2563eb;
  animation:sw-spin 0.9s linear infinite;
}
@keyframes sw-spin{to{transform:rotate(360deg)}}
#sw-status-text{font-size:15px;font-weight:600;color:#e2e8f0;}
#sw-status-sub{font-size:12px;color:#64748b;text-align:center;max-width:280px;line-height:1.5;}
</style>

<script>
// ── Step 1: Translate ?cirrus=<port> → ?ss=ws://host:port ────────────────────
// Also inject default Pixel Streaming URL params for best latency & input.
// player.js uses useUrlParams:true so it reads all of these.
(function() {
  var p = new URLSearchParams(location.search);
  var changed = false;

  function setDefault(key, val) {
    if (!p.has(key)) { p.set(key, val); changed = true; }
  }

  function validPort(value) {
    return /^\d{1,5}$/.test(value || '') && Number(value) >= 1 && Number(value) <= 65535;
  }
  function localSignallingUrl(value) {
    try {
      var parsed = new URL(value);
      return (parsed.protocol === 'ws:' || parsed.protocol === 'wss:') &&
        parsed.hostname.toLowerCase() === location.hostname.toLowerCase() &&
        !parsed.username && !parsed.password && validPort(parsed.port);
    } catch (_error) {
      return false;
    }
  }

  var cirrusPort = p.get('cirrus');
  if (validPort(cirrusPort)) {
    var wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.hostname + ':' + cirrusPort;
    window._swCirrusWs = wsUrl;
    if (p.get('ss') !== wsUrl) { p.set('ss', wsUrl); changed = true; }
  } else {
    if (cirrusPort !== null) { p.delete('cirrus'); changed = true; }
    var requestedSignalling = p.get('ss');
    if (requestedSignalling && localSignallingUrl(requestedSignalling)) {
      window._swCirrusWs = requestedSignalling;
    } else if (requestedSignalling !== null) {
      p.delete('ss');
      changed = true;
    }
  }

  // Subscribe directly to the Editor streamer (skip streamer-select UI)
  setDefault('StreamerId',     'Editor');
  // Auto-connect & auto-play
  setDefault('AutoConnect',    'true');
  setDefault('AutoPlayVideo',  'true');
  setDefault('StartVideoMuted','true');
  setDefault('WaitForStreamer','true');

  // Input: enable all, hovering mouse for frictionless control
  setDefault('HoveringMouse', 'true');
  setDefault('KeyboardInput', 'true');
  setDefault('MouseInput',    'true');
  setDefault('GamepadInput',  'true');
  setDefault('TouchInput',    'true');
  setDefault('FakeMouseWithTouches', 'false');
  setDefault('SuppressBrowserKeys',  'false');

  // Quality: player controls quality, match resolution, no AFK timeout
  setDefault('ControlsQuality',   'true');
  setDefault('MatchViewportRes',  'true');
  setDefault('TimeoutIfIdle',     'false');
  setDefault('WebRTCFPS',         '60');

  if (changed) history.replaceState({}, '', location.pathname + '?' + p.toString());
})();

// ── Step 2: Monkey-patch WebSocket as backup ─────────────────────────────────
// player.js reads ?ss= directly, but this catches any fallback connections.
(function() {
  if (!window._swCirrusWs) return;
  var _OrigWS = window.WebSocket;
  var _pageOriginWs = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  window.WebSocket = function(url, protocols) {
    if (typeof url === 'string' && url.startsWith(_pageOriginWs)) {
      url = window._swCirrusWs;
    }
    return protocols ? new _OrigWS(url, protocols) : new _OrigWS(url);
  };
  window.WebSocket.CONNECTING = _OrigWS.CONNECTING;
  window.WebSocket.OPEN       = _OrigWS.OPEN;
  window.WebSocket.CLOSING    = _OrigWS.CLOSING;
  window.WebSocket.CLOSED     = _OrigWS.CLOSED;
  window.WebSocket.prototype  = _OrigWS.prototype;
})();

// Observe the actual WebRTC data channel. A playing <video> is not sufficient
// evidence that keyboard input can reach UE; commands sent before the input
// channel opens are dropped by the Pixel Streaming frontend.
(function() {
  var OriginalPeerConnection = window.RTCPeerConnection;
  if (!OriginalPeerConnection) return;
  window._swInputDataChannelOpen = false;
  window._swOpenDataChannelCount = 0;

  function watchChannel(channel) {
    if (!channel || channel._swObserved) return;
    channel._swObserved = true;
    function markOpen() {
      if (channel._swOpen) return;
      channel._swOpen = true;
      window._swOpenDataChannelCount += 1;
      window._swInputDataChannelOpen = true;
      if (typeof window.swMaybeSignalReady === 'function') window.swMaybeSignalReady();
    }
    function markClosed() {
      if (!channel._swOpen && channel.readyState !== 'closed') return;
      if (channel._swOpen) {
        window._swOpenDataChannelCount = Math.max(0, window._swOpenDataChannelCount - 1);
      }
      channel._swOpen = false;
      window._swInputDataChannelOpen = window._swOpenDataChannelCount > 0;
      if (!window._swInputDataChannelOpen && typeof window.swMarkStreamDisconnected === 'function') {
        window.swMarkStreamDisconnected();
      }
    }
    if (channel.readyState === 'open') markOpen();
    else channel.addEventListener('open', markOpen, { once: true });
    channel.addEventListener('close', markClosed);
    channel.addEventListener('error', markClosed);
  }

  var originalCreateDataChannel = OriginalPeerConnection.prototype.createDataChannel;
  OriginalPeerConnection.prototype.createDataChannel = function() {
    var channel = originalCreateDataChannel.apply(this, arguments);
    watchChannel(channel);
    return channel;
  };

  function ObservedPeerConnection() {
    var connection = new OriginalPeerConnection(...arguments);
    connection.addEventListener('datachannel', function(event) { watchChannel(event.channel); });
    connection.addEventListener('connectionstatechange', function() {
      if (connection.connectionState === 'failed' ||
          connection.connectionState === 'disconnected' ||
          connection.connectionState === 'closed') {
        window._swOpenDataChannelCount = 0;
        window._swInputDataChannelOpen = false;
        if (typeof window.swMarkStreamDisconnected === 'function') window.swMarkStreamDisconnected();
      }
    });
    return connection;
  }
  Object.setPrototypeOf(ObservedPeerConnection, OriginalPeerConnection);
  ObservedPeerConnection.prototype = OriginalPeerConnection.prototype;
  window.RTCPeerConnection = ObservedPeerConnection;
  if (window.webkitRTCPeerConnection === OriginalPeerConnection) {
    window.webkitRTCPeerConnection = ObservedPeerConnection;
  }
})();

// ── Silence benign player.js console noise ───────────────────────────────────
(function() {
  var origLog = console.log;
  console.log = function() {
    var msg = Array.prototype.join.call(arguments, ' ');
    if (msg.indexOf('Data channel cannot send yet') !== -1) return;
    if (msg.indexOf('Skipping sending message') !== -1) return;
    origLog.apply(console, arguments);
  };
})();
</script>

<!-- player.js: UMD bundle with useUrlParams:true — reads all ?param= from URL -->
<script defer src="/ue-assets/player.js"></script>
</head>

<body style="width:100%;height:100%">

<!-- Status overlay: shown until video streams, then faded out -->
<div id="sw-status-overlay">
  <div id="sw-spinner"></div>
  <div id="sw-status-text">Connecting to UE Stream…</div>
  <div id="sw-status-sub">Establishing WebRTC connection via Cirrus.</div>
</div>

<script>
var _overlay   = null;
var _hidden    = false;
var _lastViewportKey = "";
var _resizeTimer = null;
var _videoFrameReady = false;
var _readyPosted = false;
var _lastVideoFrameAt = 0;
var _disconnectPosted = false;

function swDispatchPixelStreamingKey(type, key, code, keyCode, altKey) {
  var target = document.getElementById('streamingVideo') || document.body;
  var ev = new KeyboardEvent(type, {
    key: key,
    code: code,
    altKey: altKey === true,
    bubbles: true,
    cancelable: true
  });
  Object.defineProperty(ev, 'keyCode', { get: function() { return keyCode; } });
  Object.defineProperty(ev, 'which',   { get: function() { return keyCode; } });
  target.dispatchEvent(ev);
}

function swSendVistaPlayKey() {
  swDispatchPixelStreamingKey('keydown', 'Alt', 'AltLeft', 18, true);
  swDispatchPixelStreamingKey('keydown', 'p', 'KeyP', 80, true);
  swDispatchPixelStreamingKey('keyup',   'p', 'KeyP', 80, true);
  swDispatchPixelStreamingKey('keyup',   'Alt', 'AltLeft', 18, false);
}

function swSendVistaStopKey() {
  swDispatchPixelStreamingKey('keydown', 'Escape', 'Escape', 27, false);
  swDispatchPixelStreamingKey('keyup',   'Escape', 'Escape', 27, false);
}

function swExactParentCommand(e) {
  if (window.parent === window || e.origin !== location.origin || e.source !== window.parent) return null;
  var data = e.data;
  if (!data || typeof data !== 'object' || Array.isArray(data)) return null;
  var keys = Object.keys(data);
  if (keys.length !== 1 || keys[0] !== 'type') return null;
  if (data.type === 'sw-vista-play' || data.type === 'sw-vista-stop') return data.type;
  return null;
}

function swViewportKey() {
  var vv = window.visualViewport;
  var w = Math.round((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth || 0);
  var h = Math.round((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight || 0);
  return w && h ? (w + "x" + h) : "";
}

function swDispatchViewportResize(force) {
  var key = swViewportKey();
  if (!key) return;
  if (!force && key === _lastViewportKey) return;
  _lastViewportKey = key;
  if (_resizeTimer) clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(function() {
    window.dispatchEvent(new Event('resize'));
  }, 80);
}

function swHideOverlay() {
  if (_hidden) return;
  _hidden = true;
  if (_overlay) _overlay.classList.add('hidden');
}

function swMaybeSignalReady() {
  if (_readyPosted || !_videoFrameReady || window._swInputDataChannelOpen !== true) return;
  _readyPosted = true;
  _disconnectPosted = false;
  swHideOverlay();
  try { window.parent.postMessage({ type: 'sw-stream-connected' }, location.origin); } catch {}
}

function swMarkStreamDisconnected() {
  _videoFrameReady = false;
  _readyPosted = false;
  if (_disconnectPosted) return;
  _disconnectPosted = true;
  try { window.parent.postMessage({ type: 'sw-stream-disconnected' }, location.origin); } catch {}
}
window.swMarkStreamDisconnected = swMarkStreamDisconnected;

// Attach listeners to the video element — hide overlay on first frame
function swAttachVideo(v) {
  if (v._swAttached) return;
  v._swAttached = true;

  var lastTime = -1;
  var keepaliveTimer = null;

  function onFrame() {
    if (v.currentTime !== lastTime && v.currentTime > 0) {
      lastTime = v.currentTime;
      _videoFrameReady = true;
      _lastVideoFrameAt = Date.now();
      swMaybeSignalReady();
      // Keepalive is evidence of advancing decoded video plus an open input
      // channel, not merely evidence that the iframe JavaScript is alive.
      if (!keepaliveTimer) {
        keepaliveTimer = setInterval(function() {
          if (_lastVideoFrameAt > 0 &&
              Date.now() - _lastVideoFrameAt <= 15000 &&
              window._swInputDataChannelOpen === true) {
            try { window.parent.postMessage({ type: 'sw-keepalive' }, location.origin); } catch {}
          } else {
            swMarkStreamDisconnected();
          }
        }, 10000);
      }
    }
  }

  // timeupdate fires whenever video time advances (works for WebRTC streams)
  v.addEventListener('timeupdate', onFrame);
  // requestVideoFrameCallback is the strongest browser signal that a decoded
  // frame was actually presented; timeupdate remains the compatibility path.
  if (typeof v.requestVideoFrameCallback === 'function') {
    var watchDecodedFrame = function() {
      onFrame();
      v.requestVideoFrameCallback(watchDecodedFrame);
    };
    v.requestVideoFrameCallback(watchDecodedFrame);
  }
  v.addEventListener('stalled', swMarkStreamDisconnected);
  v.addEventListener('emptied', swMarkStreamDisconnected);
  v.addEventListener('ended', swMarkStreamDisconnected);
  v.addEventListener('playing', function() {
    if (v.readyState >= 2 && v.currentTime > 0) onFrame();
  });
  // Immediate check in case already playing
  if (!v.paused && v.readyState >= 2 && v.currentTime > 0) onFrame();
}

// Watch DOM for streamingVideo appearing (player.js creates it asynchronously)
function swWatchForVideo() {
  // Try immediately first
  var v = document.getElementById('streamingVideo');
  if (v) { swAttachVideo(v); return; }

  // MutationObserver: fires whenever DOM changes
  var obs = new MutationObserver(function() {
    var v = document.getElementById('streamingVideo');
    if (!v) return;
    obs.disconnect();
    swAttachVideo(v);
  });
  obs.observe(document.body, { childList: true, subtree: true });
}

// Listen for parent frame messages
window.addEventListener('message', function(e) {
  var command = swExactParentCommand(e);
  if (command === 'sw-vista-play') swSendVistaPlayKey();
  if (command === 'sw-vista-stop') swSendVistaStopKey();
});

document.addEventListener('DOMContentLoaded', function() {
  _overlay = document.getElementById('sw-status-overlay');
});

window.addEventListener('load', function() {
  // Auto-click any Cirrus activation overlay (hidden via CSS but still functional)
  setTimeout(function() {
    var t = document.getElementById('playOverlay') ||
            document.getElementById('connectOverlay') ||
            document.getElementById('playerUI') || document.body;
    t.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
  }, 1500);

  // Keep stream resolution matched to the real iframe viewport only.
  // Do not dispatch resize for Pixel Streaming toasts/progress overlays; those
  // DOM mutations used to make MatchViewportRes renegotiate and visually jitter.
  setTimeout(function() {
    swDispatchViewportResize(true);
    window.addEventListener('resize', function() { swDispatchViewportResize(false); });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function() { swDispatchViewportResize(false); });
    }
    if (window.ResizeObserver) {
      new ResizeObserver(function() { swDispatchViewportResize(false); }).observe(document.documentElement);
    }
  }, 2000);

  // Start watching for the video element as soon as load fires
  swWatchForVideo();
});
</script>
</body>
</html>
