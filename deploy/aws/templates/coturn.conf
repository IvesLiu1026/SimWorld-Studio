# /etc/turnserver.conf
#
# Production TURN server for SimWorld Studio Pixel Streaming.
# WebRTC needs a TURN relay when peers are behind symmetric NAT/firewall (most
# enterprise & university networks). Without it, ~30% of connections fail.
#
# Replace placeholders with your real values before deploying.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech

# Coturn REST credentials. Replace the placeholder with the same random secret
# stored in root-owned TURN_SHARED_SECRET_FILE for the Cirrus config builder.
# The browser receives only a short-lived HMAC credential, never this secret.
use-auth-secret
static-auth-secret=CHANGE_ME_TO_AT_LEAST_32_RANDOM_BYTES

realm=simworld.your-lab.edu
server-name=simworld.your-lab.edu

# Public IP of the EC2 instance. Required so SDP advertises a reachable relay.
# external-ip=PUBLIC_IP
# If the host has a private address behind an EIP, materialization emits the
# coturn public/private address form automatically.

# UDP relay port range — open exactly this range in the host firewall/ingress.
min-port=49160
max-port=49200

# TURN TLS uses the same public certificate identity. Coturn cannot share a
# single :443 listener with nginx on one IP; strict-443 deployments therefore
# need a separate TURN IP/load balancer. :5349 is the default supported path.
cert=/etc/letsencrypt/live/simworld.your-lab.edu/fullchain.pem
pkey=/etc/letsencrypt/live/simworld.your-lab.edu/privkey.pem
no-tlsv1
no-tlsv1_1

# Recommended hardening
no-loopback-peers
no-multicast-peers
no-cli
stale-nonce=600
total-quota=200
user-quota=12
syslog
