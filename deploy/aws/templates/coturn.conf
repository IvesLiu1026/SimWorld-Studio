# /etc/turnserver.conf
#
# Minimal TURN server for SimWorld Studio Pixel Streaming.
# WebRTC needs a TURN relay when peers are behind symmetric NAT/firewall (most
# enterprise & university networks). Without it, ~30% of connections fail.
#
# Replace placeholders with your real values before deploying.

listening-port=3478
fingerprint
lt-cred-mech

# Long-term credentials — used by Cirrus's signalling JSON. Rotate periodically.
user=simworld:CHANGE_ME_TO_A_STRONG_SECRET

realm=simworld.your-lab.edu
server-name=simworld.your-lab.edu

# Public IP of the EC2 instance. Required so SDP advertises a reachable relay.
# external-ip=PUBLIC_IP
# Or if the EC2 has only a private IP behind an EIP, use:
# external-ip=PUBLIC_IP/PRIVATE_IP

# UDP relay port range — open these in the EC2 Security Group too.
min-port=49152
max-port=65535

# No-TLS minimal config (run behind ALB if you need TLS); add cert lines for
# turns:// if you want encrypted TURN over TCP/443 (helps in strict firewalls).
no-tls
no-dtls

# Recommended hardening
no-loopback-peers
no-multicast-peers
no-cli
syslog
