# /etc/nginx/sites-available/simworld
#
# Reverse proxy for SimWorld Studio multi-tenant deploy.
#
# Routes:
#   /                              → Node web server :3002
#   /pixel-stream/session/<opaque> → authenticated Node WebSocket gateway
#   /api/health       → bypasses Basic Auth for ALB checks
#
# Auth: Basic Auth in front of everything except /api/health.
# Swap for `auth_request /oauth2/auth;` if you put oauth2-proxy in front.

upstream simworld_web { server 127.0.0.1:3002; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name simworld.your-lab.edu;
    # certbot will rewrite this to 301 → 443
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name simworld.your-lab.edu;

    # Filled in by `certbot --nginx`
    # ssl_certificate     /etc/letsencrypt/live/simworld.your-lab.edu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/simworld.your-lab.edu/privkey.pem;

    # Generous limits for SSE + WebSocket
    client_max_body_size  20m;
    proxy_read_timeout    24h;
    proxy_send_timeout    24h;
    send_timeout          24h;

    auth_basic           "SimWorld Studio";
    auth_basic_user_file /etc/nginx/htpasswd;

    # Inject the authenticated username into a header that the Node server can
    # read as X-Forwarded-User and use as session userId (instead of req.ip).
    proxy_set_header X-Forwarded-User  $remote_user;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Host              $host;

    # ── Web app + API ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://simworld_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;  # SSE
    }

    # Health endpoint with no auth so external monitors can probe.
    location = /api/health {
        auth_basic off;
        proxy_pass http://simworld_web/api/health;
    }

    # ── Session-bound browser signalling WebSocket ──────────────────────────
    # Node validates the HttpOnly Studio session + opaque endpoint binding and
    # proxies internally to that slot's loopback Cirrus HttpPort. Nginx must
    # never route a browser to StreamerPort, SFUPort, MCP, or a caller-selected
    # numeric slot/port.
    location ^~ /pixel-stream/session/ {
        proxy_pass http://simworld_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 24h;
    }
}
