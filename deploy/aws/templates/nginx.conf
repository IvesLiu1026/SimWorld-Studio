# /etc/nginx/sites-available/simworld
#
# Reverse proxy for SimWorld Studio multi-tenant deploy.
#
# Routes:
#   /                 → Node web server :3002
#   /cirrus/<slot>/*  → per-slot Cirrus signalling HTTP    (slot N → 8585+2N)
#   /ws/cirrus/<slot> → per-slot Cirrus signalling WS      (slot N → 8586+2N)
#   /api/health       → bypasses Basic Auth for ALB checks
#
# Auth: Basic Auth in front of everything except /api/health.
# Swap for `auth_request /oauth2/auth;` if you put oauth2-proxy in front.

upstream simworld_web { server 127.0.0.1:3002; }

# Generated map: slot id → Cirrus HTTP port. Default UE_BASE_CIRRUS_HTTP=8585,
# stride=2 → slot 0=8585, 1=8587, 2=8589, 3=8591. Adjust if you change envs.
map $slot $cirrus_http_port {
    default 8585;
    "0" 8585;
    "1" 8587;
    "2" 8589;
    "3" 8591;
}
map $slot $cirrus_ws_port {
    default 8586;
    "0" 8586;
    "1" 8588;
    "2" 8590;
    "3" 8592;
}

server {
    listen 80;
    server_name simworld.your-lab.edu;
    # certbot will rewrite this to 301 → 443
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name simworld.your-lab.edu;

    # Filled in by `certbot --nginx`
    # ssl_certificate     /etc/letsencrypt/live/simworld.your-lab.edu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/simworld.your-lab.edu/privkey.pem;

    # Generous limits for SSE + WebSocket
    client_max_body_size  20m;
    proxy_read_timeout    24h;
    proxy_send_timeout    24h;
    send_timeout          24h;

    auth_basic           "SimWorld Studio";
    auth_basic_user_file /etc/nginx/htpasswd;

    # Inject the authenticated username into a header that the Node server can
    # read as X-Forwarded-User and use as session userId (instead of req.ip).
    proxy_set_header X-Forwarded-User  $remote_user;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;

    # ── Web app + API ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://simworld_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;  # SSE
    }

    # Health endpoint with no auth so external monitors can probe.
    location = /api/health {
        auth_basic off;
        proxy_pass http://simworld_web/api/health;
    }

    # ── Cirrus per slot — HTTP (signalling, player.html, etc) ───────────────
    # URL: /cirrus/<slot>/...  e.g. /cirrus/0/, /cirrus/2/Streamer/
    location ~ ^/cirrus/(?<slot>\d+)/(?<rest>.*)$ {
        proxy_pass http://127.0.0.1:$cirrus_http_port/$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Cirrus per slot — WebSocket ─────────────────────────────────────────
    # The PixelStreaming front-end opens ws to the same origin; the web app
    # rewrites the URL to /ws/cirrus/<slot>/ before connecting.
    location ~ ^/ws/cirrus/(?<slot>\d+)/?$ {
        proxy_pass http://127.0.0.1:$cirrus_ws_port/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 24h;
    }
}
