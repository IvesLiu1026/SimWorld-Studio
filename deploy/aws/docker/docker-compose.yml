# SimWorld Studio — containerized web stack (UE on host).
#
# Run from the repo root:
#   docker compose -f deploy/aws/docker/docker-compose.yml up -d
#
# Prereqs on host:
#   - UE 5.3.2 at /opt/ue-engine
#   - Project skeleton at /opt/simworld-project
#   - Content at /opt/simworld-content
#   - Per-slot state dirs at /var/lib/simworld/slots (created by slot-launcher.sh)
#   - simworld user exists (so per-slot files inherit correct ownership)

services:
  web:
    build:
      context: ../../..        # repo root
      dockerfile: deploy/aws/docker/Dockerfile.web
    image: ${SIMWORLD_WEB_IMAGE:?Set an immutable simworld/web tag or digest}
    container_name: simworld-web
    restart: unless-stopped

    # Host networking so the container can:
    #   1. Reach UE on 127.0.0.1:55559+ (MCP) and :9017+ (UCV)
    #   2. Bind :3002 directly for nginx upstream
    #   3. Be reached by Cirrus WebRTC peers without container NAT mangling
    network_mode: host

    # Mount everything UE-related read-write so spawning slot-launcher.sh
    # (which writes Saved/Intermediate) works. The script itself is bind-
    # mounted into /deploy/scripts during image build (see Dockerfile).
    volumes:
      - /opt/ue-engine:/opt/ue-engine:ro
      - /opt/simworld-project:/opt/simworld-project:ro
      - /opt/simworld-content:/opt/simworld-content:ro
      - /var/lib/simworld:/var/lib/simworld
      - ${STUDIO_ACCESS_TOKEN_FILE_HOST:?Set STUDIO_ACCESS_TOKEN_FILE_HOST}:/run/secrets/studio_access_token:ro
      - ${STUDIO_PIXEL_STREAMING_HMAC_KEY_FILE_HOST:?Set STUDIO_PIXEL_STREAMING_HMAC_KEY_FILE_HOST}:/run/secrets/pixel_streaming_hmac:ro
      - ${TURN_SHARED_SECRET_FILE_HOST:?Set TURN_SHARED_SECRET_FILE_HOST}:/run/secrets/turn_shared_secret:ro
      - ${POSTGRES_URL_FILE_HOST:?Set POSTGRES_URL_FILE_HOST}:/run/secrets/postgres_url:ro
      - ${QDRANT_API_KEY_FILE_HOST:?Set QDRANT_API_KEY_FILE_HOST}:/run/secrets/qdrant_api_key:ro
      - ${EMBED_SERVICE_TOKEN_FILE_HOST:?Set EMBED_SERVICE_TOKEN_FILE_HOST}:/run/secrets/embed_service_token:ro
      - ${ASSET_DB_DIR_HOST:?Set ASSET_DB_DIR_HOST}:/srv/simworld/asset-db:ro
      - ${VISTA_IMPORT_BUNDLE_ROOT_HOST:?Set VISTA_IMPORT_BUNDLE_ROOT_HOST}:/srv/simworld/vista-import:ro
      - ${VISTA_SCENE_LAYOUT_PROFILE_FILE_HOST:?Set VISTA_SCENE_LAYOUT_PROFILE_FILE_HOST}:/run/simworld/config/vista-scene-layout.json:ro
      - ${VISTA_ANIMATION_CONTENT_PROFILE_FILE_HOST:?Set VISTA_ANIMATION_CONTENT_PROFILE_FILE_HOST}:/run/simworld/config/vista-animation-content-profile.json:ro
      - ${VISTA_ANIMATION_UE_PLUGIN_ARTIFACT_FILE_HOST:?Set VISTA_ANIMATION_UE_PLUGIN_ARTIFACT_FILE_HOST}:/run/simworld/config/vista-animation-plugin-artifact.json:ro
      - ${REVIEW_TEXT_SMOKE_RECEIPT_FILE_HOST:?Set REVIEW_TEXT_SMOKE_RECEIPT_FILE_HOST}:/run/simworld/evidence/review-smoke-text.json:ro
      - ${REVIEW_VISUAL_SMOKE_RECEIPT_FILE_HOST:?Set REVIEW_VISUAL_SMOKE_RECEIPT_FILE_HOST}:/run/simworld/evidence/review-smoke-visual.json:ro
      - ${WEBRTC_READINESS_RECEIPT_FILE_HOST:?Set WEBRTC_READINESS_RECEIPT_FILE_HOST}:/run/simworld/evidence/webrtc-readiness.json:ro
      # Optional: persist logs to host
      - ../../../simworld_studio_workspace/logs:/app/server/logs

    # IMPORTANT: the container needs to be able to spawn UE on the HOST, not
    # in itself. We do that by giving it access to the host's process
    # namespace and exec'ing /opt/ue-engine/Engine/Binaries/Linux/UnrealEditor
    # directly — but the Vulkan/NVIDIA stack requires the host driver, which
    # is NOT visible to the container by default.
    #
    # Two options:
    #   A) Don't spawn UE from the container — run slot-launcher.sh on the
    #      HOST, supervised by the host's systemd. The container's slot-pool
    #      sends start/stop over a small unix socket. (cleaner but more code)
    #   B) Give the container access to the NVIDIA stack via the NVIDIA
    #      Container Toolkit's runtime. Requires `--gpus all` and the host
    #      having `nvidia-container-toolkit` installed.
    #
    # For this compose file we go with (B) for simplicity. If your host
    # doesn't have nvidia-container-toolkit, comment out the deploy block
    # below and use option (A) via the slot-pool-host-bridge service further
    # down (not yet shipped — see deploy/aws/README.md "Docker (optional)").
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, video, utility]

    environment:
      - NODE_ENV=production
      - CLAUDE_MODEL=claude-opus-4-8
      - UE_POOL_ENABLED=1
      - UE_POOL_SIZE=${UE_POOL_SIZE:-4}
      - UE_STARTUP_TIMEOUT_MS=${UE_STARTUP_TIMEOUT_MS:-180000}
      - SESSION_TTL_MS=${SESSION_TTL_MS:-1800000}
      - SESSION_HARD_MAX_MS=${SESSION_HARD_MAX_MS:-10800000}
      - STUDIO_ACCESS_TOKEN_FILE=/run/secrets/studio_access_token
      - STUDIO_PIXEL_STREAMING_HMAC_KEY_FILE=/run/secrets/pixel_streaming_hmac
      - STUDIO_TRANSPORT_PROFILE=trusted_proxy
      - STUDIO_PUBLIC_ORIGIN=${STUDIO_PUBLIC_ORIGIN:?Set canonical HTTPS STUDIO_PUBLIC_ORIGIN}
      - STUDIO_TRUSTED_PROXY=127.0.0.1,::1
      - TURN_PUBLIC_HOST=${TURN_PUBLIC_HOST:?Set TURN_PUBLIC_HOST}
      - TURN_SHARED_SECRET_FILE=/run/secrets/turn_shared_secret
      - TURN_CREDENTIAL_TTL_SECONDS=${TURN_CREDENTIAL_TTL_SECONDS:-14400}
      - TURN_CREDENTIAL_RECONNECT_GRACE_SECONDS=${TURN_CREDENTIAL_RECONNECT_GRACE_SECONDS:-600}
      - TURN_TRANSPORT_POLICY=${TURN_TRANSPORT_POLICY:-relay}
      - SIMWORLD_BUILD_REVISION=${SIMWORLD_BUILD_REVISION:?Set the deployed git revision}
      - WEBRTC_READINESS_RECEIPT_PATH=/run/simworld/evidence/webrtc-readiness.json
      - WEBRTC_READINESS_RECEIPT_SHA256=${WEBRTC_READINESS_RECEIPT_SHA256:?Pin the exact WebRTC receipt bytes}
      - WEBRTC_DEPLOYMENT_FINGERPRINT=${WEBRTC_DEPLOYMENT_FINGERPRINT:?Set the reviewed deployment manifest SHA-256}
      - WEBRTC_CERTIFICATE_SHA256=${WEBRTC_CERTIFICATE_SHA256:?Set the public certificate SHA-256}
      - CRITIC_PROVIDER=claude
      - CRITIC_MODEL=claude-opus-4-8
      - CRITIC_MAX_BUDGET_USD=${CRITIC_MAX_BUDGET_USD:-0.05}
      - REVIEW_TEXT_SMOKE_RECEIPT_PATH=/run/simworld/evidence/review-smoke-text.json
      - REVIEW_TEXT_SMOKE_RECEIPT_SHA256=${REVIEW_TEXT_SMOKE_RECEIPT_SHA256:?Pin the exact Text Review receipt bytes}
      - REVIEW_VISUAL_SMOKE_RECEIPT_PATH=/run/simworld/evidence/review-smoke-visual.json
      - REVIEW_VISUAL_SMOKE_RECEIPT_SHA256=${REVIEW_VISUAL_SMOKE_RECEIPT_SHA256:?Pin the exact Visual Review receipt bytes}
      - VISTA_ASSET_RESOLUTION_ENABLED=1
      - ASSET_REQUIRE_REAL_ASSETS=true
      - ASSET_DB_DIR=/srv/simworld/asset-db
      - ASSET_SNAPSHOT_MANIFEST=/srv/simworld/asset-db/snapshot-manifest.json
      - ASSET_LIVE_AUDIT_RECEIPT=/srv/simworld/asset-db/snapshot-live-audit.json
      - ASSET_LIVE_AUDIT_RECEIPT_SHA256=${ASSET_LIVE_AUDIT_RECEIPT_SHA256:?Pin the current live-audit receipt bytes}
      - ASSET_SNAPSHOT_REVISION=${ASSET_SNAPSHOT_REVISION:?Set the immutable asset snapshot revision}
      - ASSET_READINESS_VERIFIED_REVISION=${ASSET_SNAPSHOT_REVISION:?Set the immutable asset snapshot revision}
      - VISTA_UE_CONTENT_REVISION=${VISTA_UE_CONTENT_REVISION:?Set the matching UE content revision}
      - POSTGRES_URL_FILE=/run/secrets/postgres_url
      - QDRANT_URL=${QDRANT_URL:-http://127.0.0.1:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:?Set the snapshot Qdrant collection}
      - QDRANT_API_KEY_FILE=/run/secrets/qdrant_api_key
      - EMBED_SERVICE_URL=${EMBED_SERVICE_URL:-http://127.0.0.1:7777}
      - EMBED_SERVICE_TOKEN_FILE=/run/secrets/embed_service_token
      - EMBED_VERSION=${EMBED_VERSION:?Set the pinned embedding version}
      - VISTA_IMPORT_DATASET_REVISION=${VISTA_IMPORT_DATASET_REVISION:?Set the immutable VISTA dataset revision}
      - VISTA_IMPORT_BUNDLE_ROOT=/srv/simworld/vista-import
      - VISTA_IMPORT_MANIFEST=${VISTA_IMPORT_MANIFEST:-manifest.json}
      - VISTA_IMPORT_ARTIFACT_ROOT=/var/lib/simworld/vista-imports
      - VISTA_SCENE_LAYOUT_PROFILE_ID=${VISTA_SCENE_LAYOUT_PROFILE_ID:?Set the verified scene layout profile id}
      - VISTA_SCENE_LAYOUT_PROFILE_FILE=/run/simworld/config/vista-scene-layout.json
      - VISTA_SCENE_LAYOUT_PROFILE_SHA256=${VISTA_SCENE_LAYOUT_PROFILE_SHA256:?Pin the exact scene layout profile bytes}
      - VISTA_SCENE_BUILD_RECORD_ROOT=/var/lib/simworld/vista-scene-builds
      - VISTA_ASSET_VERIFICATION_REVISION=${VISTA_ASSET_VERIFICATION_REVISION:?Set the exact scene spawn verification revision}
      - VISTA_UE_CONTENT_RECEIPT_SHA256=${VISTA_UE_CONTENT_RECEIPT_SHA256:?Pin the exact verified UE content receipt}
      - TIMELINE_REQUIRED=1
      - VISTA_ANIMATION_TIMELINE_ENABLED=1
      - VISTA_ANIMATION_CONTENT_PROFILE_FILE=/run/simworld/config/vista-animation-content-profile.json
      - VISTA_ANIMATION_CONTENT_PROFILE_SHA256=${VISTA_ANIMATION_CONTENT_PROFILE_SHA256:?Pin the exact animation content profile bytes}
      - VISTA_ANIMATION_UE_PLUGIN_ARTIFACT_FILE=/run/simworld/config/vista-animation-plugin-artifact.json
      - VISTA_ANIMATION_UE_PLUGIN_ARTIFACT_SHA256=${VISTA_ANIMATION_UE_PLUGIN_ARTIFACT_SHA256:?Pin the exact loaded plugin artifact manifest bytes}
      - VISTA_ANIMATION_RECORD_ROOT=/var/lib/simworld/vista-animation-runs

  # ── Loopback semantic asset stack ────────────────────────────────────────
  # These services use host networking so the web runtime reaches the same
  # loopback-only endpoints in local and AWS profiles. Enable explicitly with
  # `--profile asset-stack`; provisioning remains an administrator gate.
  postgres:
    profiles: ["asset-stack"]
    image: ${POSTGRES_IMAGE:?Set the reviewed immutable Postgres image digest}
    container_name: simworld-asset-postgres
    restart: unless-stopped
    network_mode: host
    command:
      - postgres
      - -p
      - ${POSTGRES_HOST_PORT:-55432}
      - -c
      - listen_addresses=127.0.0.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the snapshot database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set the snapshot database user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ${POSTGRES_DATA_DIR_HOST:?Set the persistent Postgres directory}:/var/lib/postgresql/data
      - ${POSTGRES_PASSWORD_FILE_HOST:?Set the root-managed Postgres password file}:/run/secrets/postgres_password:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p ${POSTGRES_HOST_PORT:-55432} -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    profiles: ["asset-stack"]
    image: ${QDRANT_IMAGE:?Set the reviewed immutable Qdrant image digest}
    container_name: simworld-asset-qdrant
    restart: unless-stopped
    network_mode: host
    environment:
      QDRANT__SERVICE__HOST: 127.0.0.1
      QDRANT__SERVICE__HTTP_PORT: ${QDRANT_HTTP_PORT:-6333}
      QDRANT__SERVICE__GRPC_PORT: ${QDRANT_GRPC_PORT:-6334}
    volumes:
      - ${QDRANT_DATA_DIR_HOST:?Set the persistent Qdrant directory}:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/${QDRANT_HTTP_PORT:-6333}; printf \"GET /readyz HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3; IFS= read -r status <&3; [[ $$status == *\" 200 \"* ]]'"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  embedding:
    profiles: ["asset-stack"]
    image: ${EMBED_SERVICE_IMAGE:?Set the reviewed immutable embedding image digest}
    container_name: simworld-asset-embedding
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: ${EMBED_HOST_PORT:-7777}
      EMBED_DENSE_MODEL: ${EMBED_DENSE_MODEL:?Set the dense model ID}
      EMBED_DENSE_REVISION: ${EMBED_DENSE_REVISION:?Set its immutable artifact revision}
      EMBED_DENSE_MODEL_PATH: /opt/models/dense
      EMBED_SPARSE_MODEL: ${EMBED_SPARSE_MODEL:?Set the sparse model ID}
      EMBED_SPARSE_REVISION: ${EMBED_SPARSE_REVISION:?Set its immutable artifact revision}
      EMBED_SPARSE_MODEL_PATH: /opt/models/sparse
      EMBED_DENSE_SIZE: ${EMBED_DENSE_SIZE:?Set the exact dense vector size}
      EMBED_VERSION: ${EMBED_VERSION:?Set the immutable embedding recipe}
      EMBED_PRELOAD: "1"
      EMBED_SERVICE_TOKEN_FILE: /run/secrets/embed_service_token
      FASTEMBED_CACHE_PATH: /var/cache/fastembed
    volumes:
      - ${EMBEDDING_MODEL_CACHE_DIR_HOST:?Set the persistent model cache directory}:/var/cache/fastembed
      - ${EMBED_DENSE_MODEL_DIR_HOST:?Set the verified dense model artifact directory}:/opt/models/dense:ro
      - ${EMBED_SPARSE_MODEL_DIR_HOST:?Set the verified sparse model artifact directory}:/opt/models/sparse:ro
      - ${EMBED_SERVICE_TOKEN_FILE_HOST:?Set the mode-0600 embedding bearer token file}:/run/secrets/embed_service_token:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:7777/health', timeout=3)); raise SystemExit(0 if r.get('status') == 'ready' and r.get('models_loaded') is True else 1)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Reverse proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine@sha256:516475cc129da42866742567714ddc681e5eed7b9ee0b9e9c015e464b4221a00
    container_name: simworld-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../templates/nginx.conf:/etc/nginx/conf.d/simworld.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/nginx/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - web

  # ── TURN server for WebRTC ─────────────────────────────────────────────────
  coturn:
    image: coturn/coturn:4.6@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    container_name: simworld-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${TURN_CONFIG_FILE_HOST:?Materialize coturn.conf with the shared secret}:/etc/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: ["-c", "/etc/turnserver.conf"]
