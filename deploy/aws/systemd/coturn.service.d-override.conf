# /etc/systemd/system/coturn.service.d/override.conf
#
# Drop-in override for the distro-provided coturn.service. After editing
# /etc/turnserver.conf (copied from deploy/aws/templates/coturn.conf), run:
#   sudo mkdir -p /etc/systemd/system/coturn.service.d
#   sudo cp deploy/aws/systemd/coturn.service.d-override.conf \
#           /etc/systemd/system/coturn.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl enable --now coturn

[Service]
# Distro packages ship with TURNSERVER_ENABLED=0 by default; force-enable it.
Environment=TURNSERVER_ENABLED=1
Restart=on-failure
RestartSec=10s
