[project]
name = "vista-world-daily-maintainer"
version = "0.1.0"
description = "Deterministic safety core for the VISTA World Daily Maintainer"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vista_daily_maintainer"]

[tool.uv]
package = true
