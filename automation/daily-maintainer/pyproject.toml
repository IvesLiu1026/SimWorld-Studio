[project]
name = "vista-world-daily-maintainer"
version = "0.1.0"
description = "Deterministic safety core for the VISTA World Daily Maintainer"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vista_daily_maintainer"]

[tool.hatch.build.targets.wheel.force-include]
"src/vista_daily_maintainer/resources/prompts/patcher.md" = "vista_daily_maintainer/resources/prompts/patcher.md"
"src/vista_daily_maintainer/resources/patcher-output.schema.json" = "vista_daily_maintainer/resources/patcher-output.schema.json"

[tool.hatch.build.targets.sdist.force-include]
"src/vista_daily_maintainer/resources/prompts/patcher.md" = "src/vista_daily_maintainer/resources/prompts/patcher.md"
"src/vista_daily_maintainer/resources/patcher-output.schema.json" = "src/vista_daily_maintainer/resources/patcher-output.schema.json"

[tool.uv]
package = true
